name: Build and test level 04
on:
  push:
    branches:
      - feat/nivel04-sala-estar-gato-ventiladores
      - feat/nivel04-libreros-libros-tv-v17
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all four levels
        run: npm run build
      - name: Test physics and API
        run: npm test
      - name: Check generated scene and transition
        run: |
          test -s public/sala/index.html
          grep -q 'sala-04-estar' public/levels.json
          node -e "const fs=require('fs');const s=fs.readFileSync('public/obra/index.html','utf8');const a=s.indexOf('const payload=')+14,b=s.indexOf(';',a);const p=JSON.parse(s.slice(a,b));if(!Buffer.from(p.game,'base64').toString().includes('Continuar a la sala'))process.exit(1)"
      - name: Validate generated browser JavaScript
        run: |
          node --input-type=module --check < src/living-game.generated.js
          node -e "const fs=require('fs');const s=fs.readFileSync('public/sala/index.html','utf8');const a=s.indexOf('const payload=')+14,b=s.indexOf(';',a);const p=JSON.parse(s.slice(a,b));if(!Buffer.from(p.game,'base64').toString().includes('livingBookTraps'))process.exit(1)"
      - name: Commit generated browser bundle to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sala/index.html public/obra/index.html public/levels.json src/living-game.generated.js src/construction-game.generated.js
          if ! git diff --cached --quiet; then
            git commit -m "build: generate level 04 playable bundle"
            git push
          fi
